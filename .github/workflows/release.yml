name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build source zip (without dev files)
        run: |
          zip -r exif-timeline-resync-${{ github.ref_name }}.zip \
            exif_resync.py wizard.py README.md README.fr.md explain.md \
            config.example.json requirements.txt pyproject.toml LICENSE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: exif-timeline-resync-${{ github.ref_name }}.zip
          generate_release_notes: true
